# アプリを作って配る（GitHub のリリース）
# ・ソース（非公開の WORKSTATION）を読み込んで、Mac（Apple シリコン・Intel）と Windows（x64・ARM）のファイルを作る
# ・このリポジトリに「v＋版の番号」のリリースを作って、4つのファイルを付ける（ページのダウンロードはここを指す）
# ・公開リポジトリの Actions は無料（Mac で作る分も）
# ・同じ版の番号のリリースがもうあるときは失敗する → ソースの package.json の version を上げてから動かす
name: アプリを作って配る

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ソースのブランチかタグ'
        default: 'main'
        required: true

permissions:
  contents: write
  actions: write

env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO || 'keigo29/WORKSTATION' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - name: ソースを読み込む
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: テスト
        if: runner.os == 'macOS'
        run: npm test

      - name: アプリを作る
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 署名はしない（Apple・Microsoft の有料の登録をしていないため）

      # Mac：アプリの自動アップデートで使う zip（dmg と同じ中身。アプリが展開して置きかえる）
      - name: 自動アップデート用の zip の名前をそろえる
        if: runner.os == 'macOS'
        run: |
          for a in arm64 x64; do
            [ -f "dist/Workstation-$a.zip" ] && mv "dist/Workstation-$a.zip" "dist/Workstation-mac-$a-update.zip"
          done
          ls -la dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            dist/Workstation-*.dmg
            dist/Workstation-mac-*-update.zip
            dist/Workstation-Setup-*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 版の番号と Chrome 拡張機能を読む
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout: |
            /package.json
            /extension/
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Chrome 拡張機能を zip にする
        run: |
          mkdir -p out
          cp -r src/extension Workstation-Chrome-extension
          zip -qr out/Workstation-Chrome-extension.zip Workstation-Chrome-extension
          unzip -l out/Workstation-Chrome-extension.zip | tail -3

      - name: リリースを作ってファイルを付ける
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./src/package.json').version")
          ls -la out
          cat > notes.md <<NOTES
          Workstation $v

          | パソコン | ファイル |
          |---|---|
          | Mac（Apple シリコン：M1・M2・M3・M4 など） | Workstation-arm64.dmg |
          | Mac（Intel） | Workstation-x64.dmg |
          | Windows | Workstation-Setup-x64.exe |
          | Windows（ARM） | Workstation-Setup-arm64.exe |
          | Chrome 拡張機能（ブックマークをサイドパネルに） | Workstation-Chrome-extension.zip |

          Workstation-mac-*-update.zip と SHA256SUMS.txt は、アプリの自動アップデートが使うファイルです（ダウンロードしなくてだいじょうぶです）。

          - Mac：dmg を開いて「アプリケーション」へドラッグ。はじめて開くと止められたら、システム設定 →「プライバシーとセキュリティ」→「このまま開く」
          - Windows：「Windows によって PC が保護されました」と出たら、「詳細情報」→「実行」
          - Chrome 拡張機能：zip を開いてできたフォルダを、chrome://extensions の「デベロッパー モード」→「パッケージ化されていない拡張機能を読み込む」で選ぶ。アプリの設定「ブックマークをブラウザで見る」のアドレスをパネルに貼って「つなぐ」
          NOTES
          # 自動アップデートで、ダウンロードしたファイルが壊れたりすり替わったりしていないかを確かめるための値
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "v$v" out/* --repo "$GITHUB_REPOSITORY" --title "Workstation $v" --notes-file notes.md

      - name: ページの版の番号を新しくする
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
